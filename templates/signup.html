<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 살아보고서</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h2>회원가입</h2>
        <form method="POST" action="{{ url_for('signup') }}">
            <!-- 이름 -->
            <div class="mb-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" class="form-control" name="name" placeholder="이름을 입력하세요" required>
            </div>

            <!-- 아이디 -->
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" name="username" placeholder="아이디를 입력하세요" required>
            </div>

            <!-- 비밀번호 -->
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <!-- 성별 -->
            <div class="mb-3">
                <label class="form-label">성별</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="남성" required>
                    <label class="form-check-label" for="male">남성</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="여성" required>
                    <label class="form-check-label" for="female">여성</label>
                </div>
            </div>

            <!-- 나이 -->
            <div class="mb-3">
                <label for="age" class="form-label">나이</label>
                <input type="number" class="form-control" name="age" placeholder="나이를 입력하세요" min="0" required>
            </div>
            
            <!-- 예산 -->
            <div class="mb-3">
                <label for="budget" class="form-label">예산 (만원)</label>
                <input type="number" class="form-control" name="budget" placeholder="예산을 입력하세요" min="0" required>
            </div>

            <!-- 선호 거래 유형 -->
            <div class="mb-3">
                <label for="deal_type" class="form-label">선호 거래 유형</label>
                <select name="deal_type" class="form-select" required>
                    <option value="">선택하세요</option>
                    <option value="월세">월세</option>
                    <option value="전세">전세</option>
                    <option value="매매">매매</option>
                </select>
            </div>

            <!-- 애완동물 보유 여부 -->
            <div class="mb-3">
                <label for="pet" class="form-label">애완동물 보유 여부</label>
                <select name="pet" class="form-select">
                    <option value="">선택하세요</option>
                    <option value="있음">있음</option>
                    <option value="없음">없음</option>
                </select>
            </div>

            <!-- 엘리베이터 선호 여부 -->
            <div class="mb-3">
                <label for="elevatorPreference" class="form-label">엘리베이터 선호 여부</label>
                <select name="elevatorPreference" class="form-select">
                    <option value="">선택하세요</option>
                    <option value="선호함">선호함</option>
                    <option value="상관없음">상관없음</option>
                </select>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" class="btn btn-primary">회원가입</button>
        </form>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
