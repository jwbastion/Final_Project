<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇 - 살아보고서</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container chat-container mt-5">
        <h2 class="text-center">챗봇과 대화하기</h2>
        <!-- 채팅 박스 -->
        <div id="chatBox" class="chat-box">
            <!-- 초기 메시지 -->
            
        </div>

        <!-- 사용자 입력 -->
        <div class="user-input mt-3">
            <input type="text" id="userInput" placeholder="답변을 입력하세요..." class="form-control">
            <button onclick="sendMessage()" class="btn btn-primary mt-2">전송하기</button>
        </div>

        <!-- 로그아웃 버튼 -->
        <div class="text-center mt-4">
            <a href="{{ url_for('logout') }}" class="btn btn-danger">로그아웃</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
