<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>라이프스타일 분석 챗봇</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .sidebar {
      background-color: #f1f3f5;
      border-right: 1px solid #dee2e6;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h5 {
      margin-top: 1rem;
    }

    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #chat-area {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem;
      background-color: #f8f9fa;
    }

    #input-area {
      padding: 1rem;
      border-top: 1px solid #dee2e6;
      background-color: white;
    }

    .message-bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
    }

    .user-msg {
      background-color: #0d6efd;
      color: white;
      align-self: flex-end;
    }

    .bot-msg {
      background-color: #6c757d;
      color: white;
      align-self: flex-start;
    }
  </style>
</head>
<body class="m-0 p-0">

  <div class="container-fluid m-0 p-0">
    <div class="row g-0">
      <!-- 📌 왼쪽 사이드바 -->
      <div class="col-md-3 sidebar p-3">
        <h5>📝 채팅 기록</h5>
        <ul id="chat-history" class="list-group mb-4"></ul>

        <h5>❤️ 관심 목록</h5>
        <ul id="wishlist" class="list-group"></ul>
      </div>

      <!-- 👉 오른쪽 챗봇 UI -->
      <div class="col-md-9 chat-container d-flex flex-column">
        <!-- 상단 헤더 -->
        <div class="bg-primary text-white p-3 fs-5 fw-bold text-center">
          라이프스타일 분석 챗봇
        </div>

        <!-- 채팅 영역 -->
        <div id="chat-area" class="d-flex flex-column px-4"></div>

        <!-- 입력창 -->
        <div id="input-area">
          <div class="input-group">
            <input type="text" id="user-input" class="form-control form-control-lg" placeholder="메시지를 입력하세요...">
            <button class="btn btn-primary btn-lg" id="send-button">전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const chatArea = document.getElementById("chat-area");
    const userInput = document.getElementById("user-input");
    const sendButton = document.getElementById("send-button");
    const chatHistory = document.getElementById("chat-history");
    const wishlist = document.getElementById("wishlist");

    function appendMessage(sender, text) {
      const messageEl = document.createElement("div");
      messageEl.className = "message-bubble " + (sender === "user" ? "user-msg" : "bot-msg");
      messageEl.innerText = text;
      chatArea.appendChild(messageEl);
      chatArea.scrollTop = chatArea.scrollHeight;

      // 기록 저장
      const historyItem = document.createElement("li");
      historyItem.className = "list-group-item small";
      historyItem.textContent = `${sender === "user" ? "🙋‍♂️" : "🤖"} ${text}`;
      chatHistory.appendChild(historyItem);
    }

    function chatbotReply(input) {
      // 임시 응답 로직
      if (input.includes("추천")) {
        // 매물 예시 추가
        const reply = "이 매물은 어떠세요? 🏠 서울 마포구 45만원";
        appendMessage("bot", reply);
        // 관심목록에 자동 추가
        const item = document.createElement("li");
        item.className = "list-group-item d-flex justify-content-between align-items-center";
        item.textContent = "🏠 마포구, 45만원";
        const removeBtn = document.createElement("button");
        removeBtn.className = "btn btn-sm btn-outline-danger";
        removeBtn.textContent = "삭제";
        removeBtn.onclick = () => item.remove();
        item.appendChild(removeBtn);
        wishlist.appendChild(item);
        return;
      }

      return "좋은 질문이에요! 더 말씀해주세요 😄";
    }

    sendButton.addEventListener("click", () => {
      const text = userInput.value.trim();
      if (!text) return;
      appendMessage("user", text);
      userInput.value = "";

      setTimeout(() => {
        const reply = chatbotReply(text);
        if (reply) appendMessage("bot", reply);
      }, 500);
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendButton.click();
    });
  </script>
</body>
</html>
