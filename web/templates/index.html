<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website with Login & Registration Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <nav class="nav">
        <a href="#" class="nav_logo">LivePort</a>

        <ul class="nav_items">
          <li class="nav_item">
            <a href="#" class="nav_link">Home</a>
            <a href="#" class="nav_link">Product</a>
            <a href="{{ url_for('chatbot') }}" class="nav_link">Services</a>
            <a href="#" class="nav_link">Contact</a>
          </li>
        </ul>

        {% if user %}
          <span class="nav_user" style="color: white;">👨🏻‍🦱 {{ user }}</span>
          <a href="{{ url_for('logout') }}"><button class="button">Logout</button></a>
        {% else %}
          <button class="button" id="form-open">Login</button>
        {% endif %}
      </nav>
    </header>

    <!-- Home -->
    <section class="home">
      <div class="form_container {% if show_form == 'signup' %}active{% endif %}">
        <i class="uil uil-times form_close"></i>

        {% if message %}
          <p style="text-align:center; color:red;">{{ message }}</p>
        {% endif %}

        <!-- Login Form -->
        <div class="form login_form">
          <form method="POST">
            <input type="hidden" name="form_type" value="login" />
            <h2>Login</h2>

            <div class="input_box">
              <input type="email" name="email" placeholder="Enter your email" required />
              <i class="uil uil-envelope-alt email"></i>
            </div>
            <div class="input_box">
              <input type="password" name="password" placeholder="Enter your password" required />
              <i class="uil uil-lock password"></i>
              <i class="uil uil-eye-slash pw_hide"></i>
            </div>

            <div class="option_field">
              <span class="checkbox">
                <input type="checkbox" id="check" />
                <label for="check">Remember me</label>
              </span>
              <a href="#" class="forgot_pw">Forgot password?</a>
            </div>

            <button class="button">Login Now</button>

            <div class="login_signup">Don't have an account? <a href="#" id="signup">Signup</a></div>
          </form>
        </div>

        <!-- Signup Form -->
        <div class="form signup_form">
          <form method="POST">
            <input type="hidden" name="form_type" value="signup" />
            <h2>Signup</h2>

            <div class="input_box">
              <input type="email" name="email" placeholder="Enter your email" required />
              <i class="uil uil-envelope-alt email"></i>
            </div>
            <div class="input_box">
              <input type="password" name="password" placeholder="Create password" required />
              <i class="uil uil-lock password"></i>
              <i class="uil uil-eye-slash pw_hide"></i>
            </div>
            <div class="input_box">
              <input type="password" name="confirm" placeholder="Confirm password" required />
              <i class="uil uil-lock password"></i>
              <i class="uil uil-eye-slash pw_hide"></i>
            </div>

            <!-- 추가된 필드들 -->
            <div class="input_box">
              <input type="text" name="name" placeholder="Enter your name" required />
            </div>

            <div class="input_box">
              <input type="number" name="age" placeholder="Enter your age" required min="1" />
            </div>

            <div class="input_box">
              <input type="number" name="budget" placeholder="Enter your budget (만원)" required min="0" />
            </div>

            <!-- 성별 (라디오 버튼) -->
            <div class="radio">
              <label>Gender</label><br>
              <label><input type="radio" name="gender" value="male" required /> 남성</label>
              <label><input type="radio" name="gender" value="female" required /> 여성</label>
              <label><input type="radio" name="gender" value="other" required /> 기타</label>
            </div>

            <!-- 선호 거래 유형 (라디오 버튼) -->
            <div class="radio">
              <label>Transaction</label><br>
              <label><input type="radio" name="deal_type" value="monthly" required /> 월세</label>
              <label><input type="radio" name="deal_type" value="lease" required /> 전세</label>
              <label><input type="radio" name="deal_type" value="sale" required /> 매매</label>
            </div>

            <button class="button">Signup Now</button>

            <div class="login_signup">Already have an account? <a href="#" id="login">Login</a></div>
          </form>
        </div>
      </div>
    </section>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
