<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>거주지 설문조사</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/survey.css">
</head>
<body>

<div class="vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg border-0 rounded-4 w-100 mx-3" style="max-width: 700px; min-height: 550px;">
    <div class="card-body p-5 d-flex flex-column justify-content-between">

      <!-- 시작 화면 -->
      <div id="start-screen">
        <h2 class="mb-4 fw-semibold text-center">🏠 거주지 설문조사</h2>
        <p class="text-center">간단한 질문에 답해서 나에게 맞는 집을 추천받아보세요!</p>
        <div class="d-grid mt-5">
          <button id="start-button" class="btn btn-primary btn-lg">시작하기</button>
        </div>
      </div>

      <!-- 설문 화면 -->
      <div id="survey-screen" class="d-none h-100 d-flex flex-column justify-content-between">
        <div>
          <h4 class="mb-3 text-center fw-semibold">질문 <span id="question-number"></span>/<span id="total-questions"></span></h4>
          <div class="progress mb-3" style="height: 12px;">
            <div class="progress-bar bg-success" id="progress-fill" style="width: 0%;" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
          </div>

          <label id="question-box" class="form-label h5 fw-bold"></label>
          <div id="input-box" class="mt-3"></div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button id="prev-button" class="btn btn-outline-secondary btn-lg">이전</button>
          <button id="next-button" class="btn btn-success btn-lg">다음</button>
        </div>
      </div>

      <!-- 완료 화면 -->
      <div id="complete-screen" class="d-none text-center">
        <h2 class="fw-bold">🎉 설문이 완료되었습니다!</h2>
        <p class="mt-3">입력해주셔서 감사합니다. 결과를 분석 중입니다.</p>
        <a href="{{ url_for('chat') }}" class="btn btn-primary btn-lg mt-4">라이프스타일 분석 받으러 가기</a>
      </div>

    </div>
  </div>
</div>

<script>
  const questions = [
    {
      text: "월세 예산은 얼마인가요?",
      input: `
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="rent" value="~30만원" id="rent1">
          <label class="form-check-label" for="rent1">~30만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="rent" value="30~50만원" id="rent2">
          <label class="form-check-label" for="rent2">30~50만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="rent" value="50~70만원" id="rent3">
          <label class="form-check-label" for="rent3">50~70만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="rent" value="70만원 이상" id="rent4">
          <label class="form-check-label" for="rent4">70만원 이상</label>
        </div>
      `
    },
    {
      text: "보증금 최대 얼마까지 가능하신가요?",
      input: `
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="deposit" value="~500만원" id="deposit1">
          <label class="form-check-label" for="deposit1">~500만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="deposit" value="500~1000만원" id="deposit2">
          <label class="form-check-label" for="deposit2">500~1000만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="deposit" value="1000~1500만원" id="deposit3">
          <label class="form-check-label" for="deposit3">1000~1500만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="deposit" value="1500만원 이상" id="deposit4">
          <label class="form-check-label" for="deposit4">1500만원 이상</label>
        </div>
      `
    },
    {
      text: "관리비는 어느 정도 부담 가능하신가요?",
      input: `
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="maintenance" value="~5만원" id="maintenance1">
          <label class="form-check-label" for="maintenance1">~5만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="maintenance" value="5~10만원" id="maintenance2">
          <label class="form-check-label" for="maintenance2">5~10만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="maintenance" value="10~15만원" id="maintenance3">
          <label class="form-check-label" for="maintenance3">10~15만원</label>
        </div>
        <div class="form-check fs-5">
          <input class="form-check-input" type="radio" name="maintenance" value="15만원 이상" id="maintenance4">
          <label class="form-check-label" for="maintenance4">15만원 이상</label>
        </div>
      `
    },
    {
      text: "엘리베이터는 꼭 필요하신가요?",
      input: `
        <select class="form-select form-select-lg">
          <option value="">선택하세요</option>
          <option value="yes">네</option>
          <option value="no">아니요</option>
        </select>
      `
    },
    {
      text: "가장 중요한 요소를 골라주세요",
      input: `
        <select class="form-select form-select-lg">
          <option value="">선택하세요</option>
          <option value="transport">교통</option>
          <option value="safety">안전</option>
          <option value="health">건강</option>
          <option value="life">생활 편의</option>
        </select>
      `
    }
  ];

  let current = 0;
  const total = questions.length;

  const startScreen = document.getElementById("start-screen");
  const surveyScreen = document.getElementById("survey-screen");
  const completeScreen = document.getElementById("complete-screen");

  const questionBox = document.getElementById("question-box");
  const inputBox = document.getElementById("input-box");
  const progressFill = document.getElementById("progress-fill");
  const questionNumber = document.getElementById("question-number");
  const totalQuestions = document.getElementById("total-questions");
  const nextButton = document.getElementById("next-button");
  const prevButton = document.getElementById("prev-button");

  totalQuestions.textContent = total;

  document.getElementById("start-button").addEventListener("click", () => {
    startScreen.classList.add("d-none");
    surveyScreen.classList.remove("d-none");
    renderQuestion(current);
  });

  function renderQuestion(index) {
    const q = questions[index];
    questionBox.innerHTML = q.text;
    inputBox.innerHTML = q.input;

    const progress = ((index) / total) * 100;
    progressFill.style.width = `${progress}%`;
    progressFill.setAttribute("aria-valuenow", progress);
    questionNumber.textContent = index + 1;

    prevButton.disabled = index === 0;
    nextButton.textContent = (index === total - 1) ? "제출" : "다음";
  }

  function isValid() {
    const input = inputBox.querySelector("input[type='radio']");
    if (input) {
      const name = input.name;
      return !!inputBox.querySelector(`input[name="${name}"]:checked`);
    } else {
      const select = inputBox.querySelector("select");
      return select && select.value !== "";
    }
  }

  nextButton.addEventListener("click", () => {
    if (!isValid()) {
      alert("선택지를 골라주세요.");
      return;
    }

    if (current < total - 1) {
      current++;
      renderQuestion(current);
    } else {
      surveyScreen.classList.add("d-none");
      completeScreen.classList.remove("d-none");
    }
  });

  prevButton.addEventListener("click", () => {
    if (current > 0) {
      current--;
      renderQuestion(current);
    }
  });
</script>
</body>
</html>
